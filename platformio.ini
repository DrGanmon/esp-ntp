[platformio]
default_envs = d1_mini

[env]
extra_scripts = pre:scripts/ensure_build_dir.py

[env:d1_mini]
platform = espressif8266@4.2.1
board = d1_mini
framework = arduino
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0
lib_deps = mikalhart/TinyGPSPlus@1.1.0
build_flags = -Wall -Wextra

[env:wt32_eth01]
platform = espressif32@6.10.0
board = wt32-eth01
framework = arduino
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0
lib_deps = mikalhart/TinyGPSPlus@1.1.0
build_flags = -Wall -Wextra
board_build.partitions = default.csv
